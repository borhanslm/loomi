# Loomi Server on your own cloud server:  cd deploy && cp .env.example .env && (edit .env) && docker compose up -d
services:
  server:
    build: ../server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://loomi:${POSTGRES_PASSWORD}@db:5432/loomi
      LOOMI_PUBLIC_URL: https://${LOOMI_DOMAIN}
    depends_on:
      db: { condition: service_healthy }
    expose: ["8787"]

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: loomi
      POSTGRES_DB: loomi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomi"]
      interval: 5s
      retries: 20

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      LOOMI_DOMAIN: ${LOOMI_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [server]

volumes:
  db:
  caddy:
