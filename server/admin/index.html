<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>پنل ادمین لومی</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%236D5BD0'/%3E%3Cpath d='M11 9v14h10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>
</head>
<body>
  <div id="gate" class="gate" hidden>
    <div class="gate-card">
      <div class="logo" aria-hidden="true">L</div>
      <h1 id="gateTitle">پنل ادمین لومی</h1>
      <p id="gateHelp" class="muted"></p>
      <form id="gateForm" autocomplete="on">
        <label class="field"><span>رمز</span>
          <input id="gatePass" type="password" autocomplete="current-password" required></label>
        <label class="field" id="gatePass2Wrap" hidden><span>تکرار رمز</span>
          <input id="gatePass2" type="password" autocomplete="new-password"></label>
        <p id="gateErr" class="err" role="alert"></p>
        <button class="btn primary wide" id="gateBtn" type="submit">ورود</button>
      </form>
      <p class="muted small" id="gateFoot"></p>
    </div>
  </div>

  <div id="shell" class="shell" hidden>
    <aside class="side">
      <div class="brand"><span class="logo" aria-hidden="true">L</span><div><b>لومی</b><span class="muted small">پنل ادمین</span></div></div>
      <nav aria-label="بخش‌ها">
        <a href="#/dashboard" data-nav="dashboard">داشبورد</a>
        <a href="#/ai" data-nav="ai">هوش مصنوعی و کلیدها</a>
        <a href="#/devices" data-nav="devices">دستگاه‌ها</a>
        <a href="#/log" data-nav="log">گزارش کارها</a>
      </nav>
      <button class="btn ghost" id="logout" type="button">خروج</button>
    </aside>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
